# Production / on-prem deployment.
#   cp .env.production.example .env   (edit it)
#   docker compose up -d                       app + database
#   docker compose --profile tls up -d         + HTTPS reverse proxy (Caddy) on 443
#   docker compose --profile av up -d          + ClamAV attachment scanning
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-itsm-platform:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://itsm:${POSTGRES_PASSWORD}@db:5432/itsm
      STORAGE_DIR: /data/files
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
    volumes:
      - files:/data/files
      - ./keys:/app/keys:ro
    ports:
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
    depends_on:
      - app

  clamav:
    image: clamav/clamav:stable
    profiles: ["av"]
    restart: unless-stopped
    volumes:
      - clamav_db:/var/lib/clamav

volumes:
  pgdata:
  files:
  caddy_data:
  clamav_db:
